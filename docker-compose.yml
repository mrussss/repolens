version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: repolens-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: repolens
      MYSQL_USER: repolens
      MYSQL_PASSWORD: repolens_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repolens-api
    command: ["/app/repolens-api"]
    restart: unless-stopped
    environment:
      - ENV=development
      - HTTP_PORT=8080
      - DB_DRIVER=mysql
      - DB_DSN=repolens:repolens_password@tcp(mysql:3306)/repolens?charset=utf8mb4&parseTime=True&loc=Local
      - SNAPSHOT_BASE_PATH=/data/repositories
      - LLM_PROVIDER=fake
    ports:
      - "8080:8080"
    volumes:
      - snapshot_data:/data/repositories
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repolens-worker
    command: ["/app/repolens-worker"]
    restart: unless-stopped
    environment:
      - ENV=development
      - DB_DRIVER=mysql
      - DB_DSN=repolens:repolens_password@tcp(mysql:3306)/repolens?charset=utf8mb4&parseTime=True&loc=Local
      - SNAPSHOT_BASE_PATH=/data/repositories
      - LLM_PROVIDER=fake
    volumes:
      - snapshot_data:/data/repositories
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  snapshot_data:
