name: Fast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web install
        working-directory: web
        run: npm ci
      - name: Web tests
        working-directory: web
        run: npm test -- --run
      - name: Web build
        working-directory: web
        run: npm run build
      - name: Format
        run: test -z "$(gofmt -l cmd/ internal/ tests/)"
      - name: Vet
        run: go vet ./...
      - name: Core tests
        run: GOFLAGS=-mod=readonly go test ./cmd/... ./internal/...
      - name: Core race tests
        run: GOFLAGS=-mod=readonly go test -race ./cmd/... ./internal/...
      - name: Component integration
        run: GOFLAGS=-mod=readonly go test ./tests/integration/...
      - name: Offline eval
        run: go run ./cmd/eval
      - name: Compose config
        run: docker compose config --quiet
