name: RepoLens CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web install and build
        working-directory: web
        run: npm ci && npm run build
      - name: Format
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Go race tests
        run: go test -race ./...
      - name: Component integration
        run: go test ./tests/integration/...
      - name: Real MySQL integration
        env:
          REPOLENS_REQUIRE_REAL_INTEGRATION: '1'
        run: go test ./tests/integration_real/...
      - name: Offline eval
        run: go run ./cmd/eval
      - name: Compose config
        run: docker compose config
      - name: Compose build
        run: docker compose build
